<div class="pb-4 px-4">
  <div class="flex justify-between items-center mb-4">
    <h2 class="text-xl font-semibold text-white">Glossário</h2>
    <button
      (click)="openCreateTerm()"
      class="flex items-center gap-1.5 px-4 py-2 rounded-full bg-blue-500/20 border border-blue-500/40 text-blue-400 text-sm font-medium hover:bg-blue-500/30 transition-colors"
    >
      <ion-icon name="add" class="text-base"></ion-icon>
      Novo
    </button>
  </div>

  <!-- Search -->
  <ion-searchbar
    [(ngModel)]="searchQuery"
    (ionInput)="onSearchChange()"
    placeholder="Buscar termo..."
    class="mb-4"
  ></ion-searchbar>

  <!-- Alphabet Filter -->
  <div class="overflow-x-auto mb-4 -mx-4 px-4 hide-scrollbar">
    <div class="flex gap-1 min-w-max">
      <button
        *ngFor="let letter of alphabet"
        (click)="selectLetter(letter)"
        [class]="selectedLetter === letter
          ? 'w-8 h-8 rounded-full bg-primary text-white text-sm font-medium'
          : 'w-8 h-8 rounded-full bg-white/10 text-white/60 text-sm'"
      >{{ letter }}</button>
    </div>
  </div>

  <!-- Terms List -->
  <div class="space-y-3">
    <div *ngFor="let term of filteredTerms" class="glass-card">
      <div class="flex justify-between items-start">
        <div class="flex-1">
          <h3 class="font-semibold text-white">{{ term.term }}</h3>
          <p class="text-sm text-white/60 mt-1">{{ term.definition }}</p>
          <div class="flex flex-wrap gap-1 mt-2" *ngIf="term.synonyms.length > 0">
            <span *ngFor="let syn of term.synonyms" class="text-xs bg-white/10 text-white/60 px-2 py-0.5 rounded">
              {{ syn }}
            </span>
          </div>
          <p *ngIf="term.usageExample" class="text-xs text-white/50 mt-2 italic">"{{ term.usageExample }}"</p>
        </div>
        <div class="flex gap-1 ml-2">
          <ion-button fill="clear" size="small" (click)="openEditTerm(term)" class="text-white/70">
            <ion-icon slot="icon-only" name="create-outline"></ion-icon>
          </ion-button>
          <ion-button fill="clear" size="small" color="danger" (click)="deleteTerm(term)">
            <ion-icon slot="icon-only" name="trash-outline"></ion-icon>
          </ion-button>
        </div>
      </div>
    </div>
  </div>

  <!-- Empty State -->
  <div *ngIf="filteredTerms.length === 0" class="text-center py-12">
    <ion-icon name="book-outline" class="text-6xl text-white/30 mb-4"></ion-icon>
    <p class="text-white/50">Nenhum termo encontrado</p>
  </div>
</div>

<!-- Term Modal -->
<ion-modal [isOpen]="showTermModal" (didDismiss)="showTermModal = false">
  <ng-template>
    <div class="min-h-full bg-slate-900 flex flex-col">
      <!-- Header -->
      <header class="glass-header sticky top-0 z-10 px-4 py-4 grid grid-cols-3 items-center">
        <button
          (click)="showTermModal = false"
          class="justify-self-start text-sm font-medium text-white/70 hover:text-white transition-colors"
        >
          Cancelar
        </button>
        <h1 class="text-lg font-bold text-white text-center">{{ termForm.id === 0 ? 'Novo Termo' : 'Editar Termo' }}</h1>
        <div class="w-8"></div>
      </header>

      <!-- Content -->
      <main class="flex-1 px-4 pt-6 pb-8 space-y-6 overflow-y-auto no-scrollbar">
        <!-- Form Card -->
        <div class="p-6 rounded-3xl glass-morphism space-y-6">
          <!-- Termo -->
          <app-form-field
            label="Termo"
            [required]="true"
            [(ngModel)]="termForm.term"
            placeholder="Ex: API"
          ></app-form-field>

          <!-- Definição -->
          <app-form-field
            label="Definição"
            [required]="true"
            type="textarea"
            [(ngModel)]="termForm.definition"
            placeholder="O que significa..."
            [rows]="4"
          ></app-form-field>

          <!-- Sinônimos -->
          <div>
            <label class="block text-xs font-medium text-gray-300 mb-2 ml-1">Sinônimos</label>
            <input
              type="text"
              [value]="termForm.synonyms?.join(', ')"
              (input)="onSynonymsChange($event)"
              placeholder="Separados por vírgula"
              class="block w-full bg-black/20 border border-white/10 rounded-xl text-white placeholder:text-white/50 px-4 py-3 text-base focus:outline-none focus:ring-1 focus:ring-white/30 transition-all"
            />
          </div>

          <!-- Entidade Relacionada -->
          <app-form-field
            label="Entidade Relacionada"
            [(ngModel)]="termForm.relatedEntity"
            placeholder="Ex: Table, Column"
          ></app-form-field>

          <!-- Exemplo de Uso -->
          <app-form-field
            label="Exemplo de Uso"
            [(ngModel)]="termForm.usageExample"
            placeholder="Uma frase de exemplo..."
          ></app-form-field>
        </div>

        <!-- Save button -->
        <app-btn-primary
          [disabled]="!termForm.term?.trim() || !termForm.definition?.trim()"
          (btnClick)="saveTerm()"
        >
          Salvar
        </app-btn-primary>
      </main>
    </div>
  </ng-template>
</ion-modal>
