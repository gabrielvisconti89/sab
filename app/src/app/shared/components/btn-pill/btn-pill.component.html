<button
  type="button"
  [disabled]="disabled"
  (click)="onClick()"
  class="flex items-center gap-1.5 px-4 py-2 rounded-full border text-sm font-medium transition-colors disabled:opacity-50 disabled:cursor-not-allowed"
  [ngClass]="colorClasses"
>
  <ion-icon *ngIf="icon" [name]="icon" class="text-base"></ion-icon>
  <ng-content></ng-content>
</button>
